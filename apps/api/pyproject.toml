[project]
name = "lumen-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "habib-rehman-dev", email = "contact.habib.dev@gmail.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3>=1.44.13",
    "docx2txt>=0.9",
    "fastapi[standard]>=0.162.0",
    "groq>=1.7.0",
    "langchain-core>=1.8.4",
    "langchain-groq>=1.2.1",
    "langgraph>=1.2.24",
    "llama-index-core>=0.14.26",
    "llama-index-embeddings-huggingface>=0.9.0",
    "llama-index-readers-file>=0.8.0",
    "llama-index-vector-stores-postgres>=0.10.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.4",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api = "api:src.main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"


[tool.fastapi]
entrypoint = "src.main:app"

[tool.uv]
package = false
